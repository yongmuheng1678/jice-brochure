<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>集策企业管理｜宣传册翻页版</title>

  <!-- StPageFlip (page-flip) - CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    :root {
      --bg: #0f0f10;
      --panel: rgba(255,255,255,0.08);
      --panel2: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --radius: 14px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 800px at 50% 10%, #2a1f1a 0%, var(--bg) 55%, #070708 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   "Noto Sans CJK SC", "Noto Sans", Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .brand .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.2px;
    }
    .brand .subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, .pill {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.10);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      background: rgba(255,255,255,0.14);
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .main {
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    /* Book wrapper: keep it centered and responsive */
    .book-shell {
      width: 96vw;
      height: 76vh;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 16px 60px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    /* The element that StPageFlip mounts into */
    #book {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .hint {
      position: absolute;
      left: 12px;
      top: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      pointer-events: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 220ms ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.85);
      animation: spin 0.9s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }

    .bottombar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .progress {
      display: grid;
      gap: 6px;
    }

    .progress .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: rgba(255,255,255,0.70);
      border-radius: 999px;
      transition: width 200ms ease;
    }

    .center-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pager {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.88);
      user-select: none;
    }

    .right-controls {
      display: flex;
      gap: 8px;
      justify-content: end;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Mobile: give more height to the book */
    @media (max-width: 640px) {
      .book-shell {
        width: 96vw;
        height: 78vh;
      }
      .bottombar {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .right-controls {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="title">集策企业管理｜宣传册</div>
        <div class="subtitle">右→左翻页 · 支持触屏滑动 · 适配移动端</div>
      </div>
      <div class="actions">
        <button id="btnFullscreen" title="全屏">全屏</button>
        <button id="btnDownload" title="下载PDF">PDF</button>
      </div>
    </div>

    <div class="main">
      <div class="book-shell">
        <div id="book" aria-label="Flipbook"></div>
        <div class="hint">提示：点击左右区域或滑动翻页（桌面支持 ← → 键）</div>

        <div id="loading" class="loading">
          <div style="display:grid;place-items:center;">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">正在加载页面…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottombar">
      <div class="progress">
        <div class="meta">
          <span id="metaLeft">进度</span>
          <span id="metaRight">0%</span>
        </div>
        <div class="bar"><i id="progressFill"></i></div>
      </div>

      <div class="center-controls">
        <button id="btnPrev">上一页</button>
        <div class="pager" id="pager">— / —</div>
        <button id="btnNext">下一页</button>
      </div>

      <div class="right-controls">
        <span class="pill" id="pillMode" title="当前显示模式">—</span>
      </div>
    </div>
  </div>

  <script>
    // Pages (exported from your PDF)
    const PAGES = ["pages/page-01.jpg", "pages/page-02.jpg", "pages/page-03.jpg", "pages/page-04.jpg", "pages/page-05.jpg", "pages/page-06.jpg", "pages/page-07.jpg", "pages/page-08.jpg", "pages/page-09.jpg", "pages/page-10.jpg", "pages/page-11.jpg", "pages/page-12.jpg"];

    const elBook = document.getElementById('book');
    const elLoading = document.getElementById('loading');
    const elLoadingText = document.getElementById('loadingText');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnDownload = document.getElementById('btnDownload');
    const pager = document.getElementById('pager');
    const progressFill = document.getElementById('progressFill');
    const metaRight = document.getElementById('metaRight');
    const pillMode = document.getElementById('pillMode');
    const shellEl = document.querySelector('.book-shell');
    const topbarEl = document.querySelector('.topbar');
    const bottombarEl = document.querySelector('.bottombar');

    let IMG_W = 800;
    let IMG_H = 1000;

    // Fit the book shell to the PDF aspect ratio to eliminate side white margins.
    function fitShell() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const topH = topbarEl?.getBoundingClientRect().height || 0;
      const bottomH = bottombarEl?.getBoundingClientRect().height || 0;

      // Reserve paddings/gaps roughly matching layout
      const paddingY = 12 * 2;     // app padding
      const gapsY = 12 * 2;        // gaps between rows
      const chromeY = topH + bottomH + paddingY + gapsY;

      const availW = Math.floor(vw * 0.96);
      const availH = Math.floor(vh - chromeY);

      const pageAR = IMG_W / IMG_H;            // single page aspect ratio
      const spreadAR = (2 * IMG_W) / IMG_H;    // two-page spread aspect ratio

      const preferSingle = vw <= 820; // mobile/small tablet => single page
      const targetAR = preferSingle ? pageAR : spreadAR;

      let w, h;
      if (availW / availH > targetAR) {
        h = availH;
        w = Math.floor(h * targetAR);
      } else {
        w = availW;
        h = Math.floor(w / targetAR);
      }

      // Clamp to sensible max to avoid overly huge on very wide screens
      w = Math.min(w, 1300);
      h = Math.min(h, 820);

      shellEl.style.width = w + "px";
      shellEl.style.height = h + "px";
    }


    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function setLoading(doneCount, total) {
      const pct = total ? Math.round((doneCount / total) * 100) : 0;
      elLoadingText.textContent = `正在加载页面…（${doneCount}/${total}）`;
      if (doneCount >= total) {
        elLoading.classList.add('hidden');
        setTimeout(() => elLoading.remove(), 350);
      }
    }

    // Preload images first (helps avoid blank pages during flipping)
    function preloadImages(urls) {
      return new Promise((resolve) => {
        let done = 0;
        setLoading(0, urls.length);

        const first = new Image();
        first.onload = () => {
          done++;
          setLoading(done, urls.length);
          const w = first.naturalWidth || 800;
          const h = first.naturalHeight || 1000;

          // Load the rest in background
          urls.slice(1).forEach((u) => {
            const img = new Image();
            img.onload = img.onerror = () => {
              done++;
              setLoading(done, urls.length);
              if (done === urls.length) resolve({w, h});
            };
            img.src = u;
          });

          if (urls.length === 1) resolve({w, h});
        };
        first.onerror = () => {
          // fallback ratio
          resolve({w: 800, h: 1000});
        };
        first.src = urls[0];
      });
    }

    function computeSettings(imgW, imgH) {
      // Preserve PDF page aspect ratio
      const ratio = imgH / imgW;

      // Use a nominal page width; actual size will be constrained by min/max below
      const nominalPageW = 520;
      const nominalPageH = Math.round(nominalPageW * ratio);

      // Use the book shell size as constraint (so pages snugly fit without side gaps)
      const shell = document.querySelector('.book-shell').getBoundingClientRect();
      const maxW = Math.floor(shell.width);
      const maxH = Math.floor(shell.height);

      return {
        width: nominalPageW,
        height: nominalPageH,
        size: "stretch",
        minWidth: 320,
        maxWidth: maxW,
        minHeight: Math.round(320 * ratio),
        maxHeight: maxH,
        drawShadow: true,
        maxShadowOpacity: 0.7,
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: false,
        flippingTime: 700,
        startPage: 0,
        // Important for RTL book feeling (right-to-left)
        rtl: true
      };
    }

    function updateUI(pageFlip) {
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      pager.textContent = `${current} / ${total}`;

      const pct = total ? Math.round((current / total) * 100) : 0;
      progressFill.style.width = `${pct}%`;
      metaRight.textContent = `${pct}%`;

      btnPrev.disabled = (current <= 1);
      btnNext.disabled = (current >= total);

      const orientation = pageFlip.getOrientation(); // 'portrait' or 'landscape'
      pillMode.textContent = orientation === 'portrait' ? '单页模式（手机）' : '双页模式（桌面）';
    }

    function initBook(settings) {
      // StPageFlip global name when loaded from <script/> tag:
      const pageFlip = new St.PageFlip(elBook, settings);
      pageFlip.loadFromImages(PAGES);

      // Events
      pageFlip.on('flip', () => updateUI(pageFlip));
      pageFlip.on('changeOrientation', () => updateUI(pageFlip));
      pageFlip.on('init', () => updateUI(pageFlip));

      // Controls
      btnPrev.addEventListener('click', () => pageFlip.flipPrev('top'));
      btnNext.addEventListener('click', () => pageFlip.flipNext('top'));



      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev('top');
        if (e.key === 'ArrowRight') pageFlip.flipNext('top');
      });

      // Resize handling
      const ro = new ResizeObserver(() => {
        try {
          fitShell();
          pageFlip.update(computeSettings(IMG_W, IMG_H));
          updateUI(pageFlip);
        } catch (_) {}
      });
      ro.observe(document.body);

      // Fullscreen
      btnFullscreen.addEventListener('click', async () => {
        const root = document.documentElement;
        if (!document.fullscreenElement) {
          await root.requestFullscreen?.();
        } else {
          await document.exitFullscreen?.();
        }
      });

      // "Download PDF" button (points to the original PDF next to this html)
      btnDownload.addEventListener('click', () => {
        // expects the PDF file to be placed alongside index.html
        window.open('集策企业管理-宣传册V2.0.20250406.pdf', '_blank');
      });

      return pageFlip;
    }

    (async function bootstrap() {
      // wait for library to be ready
      function waitForLib() {
        return new Promise((resolve) => {
          const t = setInterval(() => {
            if (window.St && window.St.PageFlip) {
              clearInterval(t);
              resolve();
            }
          }, 30);
        });
      }

      await waitForLib();
      const {w, h} = await preloadImages(PAGES);
      IMG_W = w; IMG_H = h;
      fitShell();
      const settings = computeSettings(IMG_W, IMG_H);
      initBook(settings);
      window.addEventListener('resize', () => {
        try { fitShell(); } catch(_) {}
      });
    })();
  </script>
</body>
</html>
